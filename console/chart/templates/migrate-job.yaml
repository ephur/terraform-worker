{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "console.fullname" . }}-migrate
  labels:
    {{- include "console.labels" . | nindent 4 }}
  annotations:
    # before the new pods start, so they come up ready on the new schema;
    # pods of the last release turn unready until they are replaced
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "console.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      # the chart's service account does not exist yet on a first install,
      # and migrating needs only the database
      {{- if not .Values.serviceAccount.create }}
      serviceAccountName: {{ include "console.serviceAccountName" . }}
      {{- end }}
      {{- include "console.podSpecCommon" . | trim | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "console.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["db", "upgrade"]
          env:
            - name: TFWORKER_CONSOLE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.key }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml (.Values.migrations.resources | default .Values.resources) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
