{{- if eq .Values.reconcile.mode "cronJob" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "console.fullname" . }}-reconcile
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.reconcile.schedule | quote }}
  # a reconcile that outlasts the schedule is not started twice
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "console.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: reconcile
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "console.serviceAccountName" . }}
          {{- include "console.podSpecCommon" . | trim | nindent 10 }}
          containers:
            - name: reconcile
              image: {{ include "console.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["reconcile"]
              env:
                {{- include "console.commonEnv" . | nindent 16 }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              resources:
                {{- toYaml (.Values.reconcile.resources | default .Values.resources) | nindent 16 }}
              volumeMounts:
                {{- include "console.volumeMounts" . | nindent 16 }}
          volumes:
            {{- include "console.volumes" . | nindent 12 }}
{{- end }}
