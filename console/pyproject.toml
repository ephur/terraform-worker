[project]
name = "tfworker-console"
dynamic = ["version"]
description = "A console for terraform-worker runs, plans and locks"
authors = [{ name = "Richard Maynard", email = "richard.maynard@gmail.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "terraform-worker",
    "alembic>=1.13,<2",
    "boto3>=1.43.121,<2",
    "click>=8.4.1,<9",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.14.1,<3",
    "pyyaml>=6.0.3,<7",
    "sqlalchemy>=2.0.30,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
tfworker-console = "tfworker_console.cli:main"

[dependency-groups]
dev = [
    "black>=26.5.1,<27",
    "coverage>=7.14.1,<8",
    "flake8>=7.3.0,<8",
    "httpx>=0.27,<1",
    "isort>=5.13.2,<6",
    "moto[s3,sts]>=5.2.2,<6",
    "pytest>=9.1.0,<10",
    "pytest-cov>=5.0.0,<6",
    "pytest-mock>=3.15.1,<4",
]

[tool.uv.sources]
terraform-worker = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The console has its own release tags, console-v1.2.3, separate from the
# worker's v1.2.3 tags.
[tool.hatch.version]
source = "vcs"
tag-pattern = '^console-v(?P<version>\d+\.\d+\.\d+.*)$'

[tool.hatch.version.raw-options]
root = ".."
dist_name = "tfworker-console"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "console-v[0-9]*"]
fallback_version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/tfworker_console"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
addopts = "--capture=sys --cov=tfworker_console --cov-report="
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 98
show_missing = true
skip_empty = true
