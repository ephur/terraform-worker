name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    # Forks syncing from upstream skip this job; change the repository to enable it there.
    if: >-
      github.repository == 'ephur/terraform-worker' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Check for credentials
        id: creds
        env:
          HAS_CREDENTIALS: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_CREDENTIALS" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret; skipping Claude review."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'
        with:
          fetch-depth: 1

      - name: Review pull request
        if: steps.creds.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the working directory.

            Read the PR description and any issue it references (`gh issue view`) to understand
            why the change is being made, then review the diff (`gh pr diff`) against that intent.

            Focus on, in order:
            - Correctness bugs and regressions, including edge cases and error handling
            - Security problems
            - Missing or weak tests for changed behavior
            - Changes that break the CLI, config format or hook interfaces for existing users
            - Code comments that are unnecessary or explain what was not done

            Formatting, import order and lint are enforced by CI; do not comment on them.
            Do not praise, restate the change, or comment on things that are fine.

            Before commenting, list existing review comments with
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
            and do not repeat a point that has already been raised, including in a resolved thread.

            Post each finding as an inline comment with
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) on the
            relevant line, stating the problem, a concrete failure scenario, and a suggested fix.
            If there are findings that do not belong on a specific line, post them in one short
            top-level comment with `gh pr comment`. If there are no new findings, post nothing.
          claude_args: |
            --model claude-fable-5-2
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
